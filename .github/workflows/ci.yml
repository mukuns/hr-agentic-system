name: HR Agentic System CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize mock database
        run: |
          python scripts/init_mock_db.py

      - name: Run test suite
        run: |
          python -m pytest -q

      - name: Summarize results
        if: always()
        run: |
          echo "CI completed for the HR agentic system." 
          echo "The test suite includes MCP discovery and /health validation checks."
